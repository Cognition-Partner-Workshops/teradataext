# =========================================================================================
# teradataext - main configuration (config/main_config.ini)
#
# Read with Python configparser, interpolation disabled. Comments must be on their own
# line (starting with # or ;). Inline comments are NOT supported: anything after "=" is
# part of the value. See config/utility_user_guide.txt and docs/DESIGN.md section 3.
# =========================================================================================

[teradata]
# TDPID (host name or COP alias) of the Teradata 16.20 system, used in the .LOGON command.
host = tdprod.example.com
# TCP port of the database gateway. Only used for the TCP pre-check (connect_check).
port = 1025
# Optional logon mechanism, e.g. TD2 or LDAP. When set it is emitted as .LOGMECH.
# Leave empty to use the client default.
logmech =
# Optional path to a credentials file (format: config/credentials.ini.example).
# Used only when TD_USER / TD_PASS are not both set. The file must be owned by the user
# running the utility and have no group/other permissions (chmod 600). Keep it OUTSIDE
# the repository. Leave empty to rely on the TD_USER / TD_PASS environment variables.
credentials_file =
# FastExport executable (name on PATH or absolute path). Env var TDX_FEXP overrides it.
fexp_path = fexp
# BTEQ executable (name on PATH or absolute path). Env var TDX_BTEQ overrides it.
bteq_path = bteq
# Session character set: ASCII or UTF8. Tables with non-LATIN (e.g. UNICODE) character
# columns fail under ASCII (never lossy); use UTF8 for them.
session_charset = ASCII
# Database in which FastExport creates its restart .LOGTABLE (tdx_lt_<hash>). The user
# needs CREATE TABLE rights there. Empty = the logon user's default database.
logtable_database =
# true = open a TCP connection to host:port before starting, to fail fast (exit 2) when
# the system is unreachable. false = skip the check.
connect_check = true

[paths]
# Base directory for every relative path below. Empty = the parent of the directory that
# holds this file (the utility root for config/main_config.ini).
base_dir =
# Data files: <db>_<table>[.partNNN].dat and <db>_<table>_<cycle_id>.zip.
output_dir = data
# Per-table metadata files (<db>_<table>.meta.ini) and audit.log.
metadata_dir = metadata
# Run logs (extract_<run_id>.log) and per-job fexp/bteq output (password masked).
log_dir = logs
# Generated fexp/bteq scripts (LOGON line masked) and the single-instance lock file.
work_dir = work
# Source table definitions.
source_tables_file = config/source_tables.ini
# Machine-managed extraction state. Do not edit it by hand.
process_state_file = config/process_state.ini

[extract]
# Output format. pipe-delimited is the only supported value.
file_format = pipe-delimited
# Number of export jobs (tables/chunks) run concurrently. A value <= 0 or "auto" means
# min(number of CPUs, max_sessions). Overridden by --parallel.
parallel = 1
# Total Teradata session budget shared by all concurrently running jobs.
max_sessions = 4
# Lowest session count a job may use (also the floor when halving after session-limit
# errors).
min_sessions = 1
# Tables with an estimated row count above this value are split into chunks.
chunk_threshold_rows = 10000000
# Target number of rows per chunk.
chunk_rows = 5000000
# Upper limit on the number of chunks for one table.
max_chunks = 64
# Jobs (tables or chunks) estimated below this many rows use BTEQ EXPORT instead of
# FastExport.
small_table_rows = 100000
# Row estimate source: stats = DBC.StatsV table statistics, falling back to COUNT(*) when
# no statistics exist; count = always run COUNT(*).
row_estimate = stats
# Trimming of CHAR (fixed-length) columns: right = trailing blanks, both = leading and
# trailing blanks, none = keep padding. VARCHAR values are never trimmed.
char_trim = right
# Maximum characters (CLOB/JSON/XML) or bytes (BLOB) exported per LOB value. A table with a
# longer value fails instead of being truncated.
lob_max_length = 32000
# Maximum exported record length in characters. A table with a longer record fails.
max_row_length = 63999
# true = zip the table's .dat files once the table is done and integrity-test the zip.
zip_on_complete = true
# false = delete the raw .dat files after the zip passed its integrity test.
keep_raw_after_zip = false
# Retries for a job that failed with a session-limit error (other errors: no retry).
retry_attempts = 3
# Wait between session-limit retries, in seconds. Each retry halves the session count.
retry_delay_seconds = 60
# Comma-separated Teradata error codes treated as session-limit failures
# (matched as "Failure <code>" / "Error <code>" in the tool output).
session_limit_errors = 2633,3130
# Comma-separated text patterns (case-insensitive) also treated as session-limit failures.
session_limit_patterns = Too many load/unload tasks,session limit,No more sessions
# true = after FastExport session-limit retries are exhausted, try once more with BTEQ
# EXPORT. false = mark the job failed.
bteq_fallback = true
# Kill a fexp/bteq job running longer than this many seconds. 0 = no timeout.
job_timeout_seconds = 0

[format]
# Field delimiter of the .dat files.
delimiter = |
# Written for NULL values.
null_sentinel = \N
# Written for zero-length string/binary values. Set it empty (empty_sentinel =) for direct
# Redshift COPY ... ESCAPE loads, where \E would load as the letter E (see the user guide).
empty_sentinel = \E
# Escape character placed before \, the delimiter, CR and LF inside text values.
escape_char = \
# Quote placed around DECIMAL/NUMBER values with precision above big_decimal_threshold.
# Set it empty (big_decimal_quote =) for direct Redshift loads into DECIMAL columns.
big_decimal_quote = "
# Precision above which decimal values are quoted with big_decimal_quote.
big_decimal_threshold = 18
