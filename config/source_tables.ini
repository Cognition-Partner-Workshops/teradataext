# =========================================================================================
# teradataext - source table definitions (config/source_tables.ini)
#
# One section per table; the section name is a free label. Keys:
#   database      Teradata database (required)
#   table         table or view name (required)
#   cdc_column    optional; incremental (CDC) column, e.g. a last-update timestamp
#   chunk_column  optional; overrides the automatically chosen chunk column
#   where         optional; static filter ANDed into every export of this table
#   enabled       optional; true (default) / false
# The table key used in process_state.ini and on the command line is DATABASE.TABLE,
# upper-cased (e.g. SALES.ORDERS). Comments must be on their own line: inline comments
# are not supported.
# =========================================================================================

# Small reference table: exported in one piece (BTEQ EXPORT when below small_table_rows).
[region]
database = SALES
table = REGION

# Large table: no chunk settings needed. When the row estimate exceeds
# chunk_threshold_rows the utility chunks it automatically (range on a numeric/date single
# primary key / primary index column, otherwise hash buckets of the primary index).
[orders]
database = SALES
table = ORDERS

# Incremental (CDC) table: each cycle exports rows with UPDATED_TS above the last committed
# watermark and up to the upper bound captured at the start of the extract.
[customer]
database = SALES
table = CUSTOMER
cdc_column = UPDATED_TS

# Explicit chunk column and a static filter. The filter is ANDed into every chunk.
[order_lines]
database = SALES
table = ORDER_LINES
chunk_column = ORDER_DATE
where = LINE_STATUS <> 'X' AND ORDER_DATE >= DATE '2020-01-01'
enabled = true

