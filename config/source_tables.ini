# =========================================================================================
# teradataext - source table definitions (config/source_tables.ini)
#
# Two kinds of section; section names are free labels.
#
# 1. Table list section (one per database): database plus a list of tables. Braces are
#    optional; separate names with commas; a long list may continue on indented lines.
#    Optional settings for all listed tables:
#      where           static filter ANDed into every export (every chunk) of every listed
#                      table; all listed tables must have the columns it uses. A long
#                      filter may continue on indented lines (joined with one space).
#      enable_for_all  true (default) = apply where to all listed tables; false = ignore it
#    No other keys are allowed. Listed tables use the automatic chunk column and a full
#    extract every cycle (no CDC), unless they also have a one-table section (2).
#
# 2. One-table section: database + one table name, plus optional settings:
#      cdc_column    incremental (CDC) column, e.g. a last-update timestamp
#      chunk_column  overrides the automatically chosen chunk column
#      where         static filter ANDed into every export (every chunk) of this table
#      enabled       true (default) / false
#    When the table is also in a list section, database/table come from the list
#    (the list always takes priority) and the settings above from this section; a
#    warning is logged. enabled = false here switches the listed table off. A where here
#    replaces the list's where for this table (they are not combined); an empty
#    "where =" extracts this table unfiltered; without a where key the list's is kept.
#
# A table may appear in only one list section and in at most one one-table section, even
# one with enabled = false (otherwise exit code 2). The table key used in process_state.ini
# and on the command line is DATABASE.TABLE, upper-cased (e.g. SALES.ORDERS). Comments must
# be on their own line: inline comments are not supported.
# =========================================================================================

# All tables of SALES to extract. Large tables are chunked automatically when the row
# estimate exceeds chunk_threshold_rows (range on a numeric/date single primary key /
# primary index column, otherwise hash buckets of the primary index).
[sales]
database = SALES
table = {REGION, ORDERS, CUSTOMER,
    ORDER_LINES}

# Date-range filter for several tables of one database. Add more conditions with AND,
# e.g. on an indented next line:  AND REGION_CODE = 'EU'
# [customer_extract]
# database = MY_DATABASE
# table = {TABLE_1, TABLE_2, TABLE_3, TABLE_4, TABLE_5}
# where = DATE_COLUMN1 >= DATE '2024-01-01' AND DATE_COLUMN2 < DATE '2025-01-01'
# enable_for_all = true

# Optional per-table settings for listed tables.

# Incremental (CDC) table: each cycle exports rows with UPDATED_TS above the last committed
# watermark and up to the upper bound captured at the start of the extract.
[customer]
database = SALES
table = CUSTOMER
cdc_column = UPDATED_TS

# Explicit chunk column and a static filter. The filter is ANDed into every chunk.
[order_lines]
database = SALES
table = ORDER_LINES
chunk_column = ORDER_DATE
where = LINE_STATUS <> 'X' AND ORDER_DATE >= DATE '2020-01-01'
enabled = true
